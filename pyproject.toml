[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t-rex-converter"
dynamic = ["version"]
description = "Native GTK4/libadwaita file converter with engine-based local processing."
readme = "README.md"
requires-python = ">=3.11"
# PyGObject/GTK4/libadwaita come from the distro (python3-gobject, gtk4,
# libadwaita), not pip — only the pip-installable runtime deps are listed.
dependencies = [
    "PyMuPDF>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
t-rex-converter = "app.gtk_main:main"

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.docs" = ["en/*.md", "id/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
